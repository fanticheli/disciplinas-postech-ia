}
.skeleton i:nth-child(1) { width: 40%; height: 12px; }
.skeleton i:nth-child(2) { width: 85%; height: 28px; }
.skeleton i:nth-child(3) { width: 100%; }
.skeleton i:nth-child(4) { width: 92%; }
.skeleton i:nth-child(5) { width: 70%; }

.state-message { padding: var(--sp-6) 0; color: var(--text-2); }
.state-message h2 { margin: 0 0 var(--sp-2); font-size: var(--fs-xl); color: var(--text); }

.toast {
  position: fixed; left: 50%; z-index: 90;
  bottom: calc(var(--bottombar-h) + env(safe-area-inset-bottom) + var(--sp-3));
  transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
  padding: var(--sp-2) var(--sp-4); border-radius: var(--r-full);
  background: var(--text); color: var(--bg); font-size: var(--fs-sm); font-weight: 600;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

.desktop-only { display: none; }

@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes sheet-in { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

@media (hover: hover) {
  .icon-btn:hover, .nav-link:hover, .nav-group-toggle:hover { background: var(--surface-2); color: var(--text); }
  .nav-link[aria-current="page"]:hover { background: var(--accent-soft); }
  .search-trigger:hover { border-color: var(--border-strong); }
  .btn:hover { border-color: var(--text-3); }
  .btn--primary:hover { border-color: transparent; background: color-mix(in srgb, var(--d, var(--accent)) 88%, var(--text)); }
  .continue-card:hover, .door:hover, .disc-card:hover, .pager-link:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
  .disc-card:hover { border-color: color-mix(in srgb, var(--d) 50%, var(--border)); }
  .row-link:hover { background: var(--surface-2); }
  .toc-link:hover { color: var(--text); }
  .code-copy:hover { background: var(--surface-3); color: var(--text); }
  .breadcrumb a:hover { color: var(--accent); text-decoration: underline; }
  .bottombar-item:hover { color: var(--text); }
  .palette-option:hover { background: var(--surface-2); }
  .palette-option[aria-selected="true"]:hover { background: var(--accent-soft); }
}

@media (min-width: 560px) {
  .action-row { display: flex; flex-wrap: wrap; }
  .topic-emoji { display: grid; }
  .stats { grid-template-columns: repeat(4, 1fr); }
  .card-grid { grid-template-columns: repeat(2, 1fr); }
  .pager { grid-template-columns: 1fr 1fr; }
  .pager-link--next:only-child { grid-column: 2; }
  .read-panel { flex-direction: row; align-items: center; justify-content: space-between; }
}

@media (min-width: 768px) {
  .page { padding: var(--sp-6) var(--sp-6) var(--sp-8); }
  .page-title { font-size: var(--fs-3xl); }
  .callout--summary .callout-body { font-size: var(--fs-xl); line-height: 1.55; }
  .hero-title { font-size: var(--fs-4xl); }
  .doors { grid-template-columns: repeat(3, 1fr); }
  .door { flex-direction: column; }
  .pros-cons { grid-template-columns: 1fr 1fr; }
  .cheatsheet { display: grid; grid-template-columns: 1fr 1fr; }
  .cheatsheet div:nth-child(2) { border-top: 0; }
  .cheatsheet div:nth-child(even) { border-left: 1px solid var(--border); }
  .palette {
    inset: 10vh 0 auto; margin: 0 auto; width: min(640px, calc(100% - 2rem)); height: auto; max-height: 70vh;
    border-radius: var(--r-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border); padding: 0;
  }
  .palette-foot {
    display: flex; gap: var(--sp-4); padding: var(--sp-2) var(--sp-4);
    border-top: 1px solid var(--border); font-size: var(--fs-xs); color: var(--text-3);
  }
  .palette-close-text { display: none; }
  .sheet { inset: auto auto 0 50%; transform: translateX(-50%); width: min(560px, 100%); }
}

@media (min-width: 1024px) {
  html { scroll-padding-top: var(--sp-5); }
  .topbar, .bottombar, .scrim, .sidebar-close, .mobile-only { display: none !important; }
  .desktop-only { display: revert; }
  .layout { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
  .sidebar {
    position: sticky; top: 0; height: 100vh; height: 100dvh; width: auto; z-index: 1;
    transform: none; visibility: visible; transition: none; box-shadow: none;
  }
  .search-trigger kbd { display: inline-block; }
  .main-col { padding-top: 0; padding-bottom: 0; }
  .reading-progress { top: 0; }
  .toast { bottom: var(--sp-5); }
  .page { padding: var(--sp-7) var(--sp-7) var(--sp-8); }
  .card-grid--3 { grid-template-columns: repeat(3, 1fr); }
  .nav-link, .nav-group-toggle { min-height: 36px; padding-top: 6px; padding-bottom: 6px; }
  .link-list a, .link-list span { min-height: 36px; }
}

@media (min-width: 1200px) {
  .article-layout { display: grid; grid-template-columns: minmax(0, 1fr) 14rem; gap: var(--sp-7); align-items: start; }
  .toc-aside { display: block; position: sticky; top: var(--sp-5); max-height: calc(100vh - var(--sp-7)); overflow-y: auto; }
  .toc-title { margin: 0 0 var(--sp-2); font-size: var(--fs-xs); font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
  .toc-trigger { display: none !important; }
}

@media (max-height: 500px) and (orientation: landscape) and (max-width: 1023px) {
  .bottombar { display: none; }
  .main-col { padding-bottom: env(safe-area-inset-bottom); }
  .toast { bottom: var(--sp-4); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important; scroll-behavior: auto !important;
  }
}
</style>
