<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Estudos · Pós Engenharia de IA Aplicada</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1a1d24; --muted:#5c6470; --line:#e6e8ec;
    --accent:#4f46e5; --accent-soft:#eef0fe;
    --good:#0f9d58; --good-soft:#e7f6ee; --bad:#d93838; --bad-soft:#fdeceb;
    --warn:#b7791f; --warn-soft:#fdf3e2; --vovo:#c026a3; --vovo-soft:#fbeaf6;
    --shadow:0 1px 2px rgba(20,25,40,.06),0 8px 24px rgba(20,25,40,.06);
    --radius:14px;
    --b0:#64748b; --b1:#4f46e5; --b2:#0d9488; --b3:#7c3aed; --b4:#d97706; --b5:#e11d48; --b6:#0284c7; --b7:#16a34a;
  }
  :root[data-theme="dark"]{
    --bg:#0e1016; --panel:#171a22; --ink:#e8eaee; --muted:#9aa2b1; --line:#262a35;
    --accent:#818cf8; --accent-soft:#20233a;
    --good:#3ecf8e; --good-soft:#13251d; --bad:#f87171; --bad-soft:#2a1717;
    --warn:#eab355; --warn-soft:#2a2314; --vovo:#f0a6dc; --vovo-soft:#2a1626;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    --b0:#94a3b8; --b1:#818cf8; --b2:#2dd4bf; --b3:#a78bfa; --b4:#fbbf24; --b5:#fb7185; --b6:#38bdf8; --b7:#4ade80;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0e1016; --panel:#171a22; --ink:#e8eaee; --muted:#9aa2b1; --line:#262a35;
      --accent:#818cf8; --accent-soft:#20233a;
      --good:#3ecf8e; --good-soft:#13251d; --bad:#f87171; --bad-soft:#2a1717;
      --warn:#eab355; --warn-soft:#2a2314; --vovo:#f0a6dc; --vovo-soft:#2a1626;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
      --b0:#94a3b8; --b1:#818cf8; --b2:#2dd4bf; --b3:#a78bfa; --b4:#fbbf24; --b5:#fb7185; --b6:#38bdf8; --b7:#4ade80;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  .layout{display:grid;grid-template-columns:300px 1fr;min-height:100vh}

  /* ---------- Sidebar ---------- */
  .side{
    background:var(--panel);border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;cursor:pointer}
  .brand h1{font-size:15px;margin:0;line-height:1.25}
  .brand small{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--b1),var(--b3));
    display:grid;place-items:center;font-size:18px;flex:0 0 auto}

  .search{position:relative;margin:6px 6px 14px}
  .search input{
    width:100%;padding:9px 12px 9px 32px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--ink);font-size:13.5px;outline:none
  }
  .search input:focus{border-color:var(--accent)}
  .search::before{content:"🔎";position:absolute;left:10px;top:8px;font-size:12px;opacity:.6}

  .progress-wrap{margin:0 6px 16px;font-size:12px;color:var(--muted)}
  .bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b1),var(--b2));transition:width .3s}

  .bloco-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin:16px 8px 6px;display:flex;align-items:center;gap:7px}
  .bloco-label .dot{width:8px;height:8px;border-radius:99px}

  .nav-item{
    display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;
    color:var(--ink);font-size:13.5px;border:1px solid transparent
  }
  .nav-item:hover{background:var(--bg)}
  .nav-item.active{background:var(--accent-soft);border-color:var(--line);font-weight:600}
  .nav-item .num{font-size:11px;font-weight:700;color:var(--muted);min-width:20px}
  .nav-item .tt{flex:1;line-height:1.25}
  .nav-item .rd{width:15px;height:15px;border-radius:99px;border:1.5px solid var(--line);flex:0 0 auto}
  .nav-item.read .rd{background:var(--good);border-color:var(--good)}
  .nav-item.read .rd::after{content:"✓";color:#fff;font-size:10px;display:grid;place-items:center;height:100%;margin-top:-1px}

  /* ---------- Main ---------- */
  .main{padding:0}
  .topbar{
    display:none;position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
    padding:10px 16px;align-items:center;gap:12px
  }
  .topbar button{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 11px;font-size:15px;cursor:pointer}
  .wrap{max-width:860px;margin:0 auto;padding:40px 32px 90px}

  .theme-toggle{position:fixed;top:16px;right:20px;z-index:30;background:var(--panel);border:1px solid var(--line);
    color:var(--ink);border-radius:99px;width:40px;height:40px;font-size:17px;cursor:pointer;box-shadow:var(--shadow)}

  /* Home */
  .hero{margin-bottom:8px}
  .eyebrow{color:var(--accent);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em}
  .hero h2{font-size:30px;line-height:1.15;margin:8px 0 10px;letter-spacing:-.02em}
  .hero p.lead{font-size:17px;color:var(--muted);margin:0;max-width:640px}
  .disc-tag{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:var(--panel);
    border:1px solid var(--line);border-radius:99px;padding:6px 14px 6px 8px;font-size:13px;box-shadow:var(--shadow)}
  .disc-tag b{background:linear-gradient(135deg,var(--b1),var(--b3));color:#fff;border-radius:99px;padding:2px 10px;font-size:12px}

  .bloco-section{margin-top:34px}
  .bloco-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .bloco-head .dot{width:11px;height:11px;border-radius:99px}
  .bloco-head h3{margin:0;font-size:15px}
  .bloco-head small{color:var(--muted);font-size:13px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;
    box-shadow:var(--shadow);transition:transform .12s,border-color .12s;position:relative;overflow:hidden
  }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cardc,var(--b1))}
  .card:hover{transform:translateY(-2px);border-color:var(--cardc,var(--accent))}
  .card .emoji{font-size:22px}
  .card h4{margin:8px 0 5px;font-size:15px;line-height:1.25}
  .card p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
  .card .meta{display:flex;gap:8px;align-items:center;margin-top:11px;font-size:11.5px;color:var(--muted)}
  .card .read-badge{color:var(--good);font-weight:600}

  .materials{margin-top:40px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
  .materials h3{margin:0 0 12px;font-size:15px}
  .materials ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
  .materials li{margin:5px 0}

  /* Topic detail */
  .crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:18px}
  .crumb a{cursor:pointer}
  .t-head{display:flex;gap:14px;align-items:flex-start}
  .t-emoji{font-size:34px;line-height:1;margin-top:2px}
  .t-head h2{margin:0 0 6px;font-size:26px;letter-spacing:-.02em;line-height:1.15}
  .badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .badge{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
  .badge.mod{background:var(--cardc,var(--b1));color:#fff;border-color:transparent}

  .oneliner{background:var(--accent-soft);border:1px solid var(--line);border-left:4px solid var(--cardc,var(--accent));
    border-radius:12px;padding:16px 18px;margin:24px 0;font-size:16.5px;line-height:1.5}
  .oneliner .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cardc,var(--accent));display:block;margin-bottom:5px}

  section.blk{margin:26px 0}
  section.blk > h3{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:9px}
  section.blk > h3 .ic{font-size:18px}
  ul.clean{list-style:none;margin:0;padding:0}
  ul.clean li{position:relative;padding:6px 0 6px 26px;font-size:15px;line-height:1.55;border-bottom:1px solid var(--line)}
  ul.clean li:last-child{border-bottom:none}
  ul.clean li::before{content:"›";position:absolute;left:6px;top:5px;color:var(--accent);font-weight:800}
  ul.steps{counter-reset:s;list-style:none;margin:0;padding:0}
  ul.steps li{position:relative;padding:7px 0 7px 34px;font-size:15px;line-height:1.55;border-bottom:1px solid var(--line)}
  ul.steps li:last-child{border-bottom:none}
  ul.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:7px;
    width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);
    font-size:12px;font-weight:700;display:grid;place-items:center}

  .vovo{background:var(--vovo-soft);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .vovo h3{color:var(--vovo)}
  .vovo p{margin:0;font-size:15.5px;line-height:1.6}
  .vovo p + p{margin-top:10px}

  .pc{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pc .col{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .pc .col.pro{background:var(--good-soft)}
  .pc .col.con{background:var(--bad-soft)}
  .pc .col h4{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:7px}
  .pc .col.pro h4{color:var(--good)} .pc .col.con h4{color:var(--bad)}
  .pc ul{list-style:none;margin:0;padding:0}
  .pc li{font-size:14px;line-height:1.5;padding:4px 0 4px 18px;position:relative}
  .pc .col.pro li::before{content:"+";position:absolute;left:2px;color:var(--good);font-weight:800}
  .pc .col.con li::before{content:"–";position:absolute;left:2px;color:var(--bad);font-weight:800}

  .traps{background:var(--warn-soft);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:14px 18px}
  .traps h3{color:var(--warn)}
  .traps ul{list-style:none;margin:0;padding:0}
  .traps li{font-size:14.5px;line-height:1.55;padding:5px 0 5px 24px;position:relative}
  .traps li::before{content:"⚠";position:absolute;left:0;top:5px;font-size:12px}

  .tip{background:var(--panel);border:1px dashed var(--accent);border-radius:12px;padding:13px 16px;font-size:14.5px}
  .tip b{color:var(--accent)}

  .cola{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
  .cola .row{border-bottom:1px solid var(--line);padding:7px 0;font-size:14px}
  .cola .row dt{font-weight:700;color:var(--ink)}
  .cola .row dd{margin:2px 0 0;color:var(--muted);font-size:13.5px}
  .disc-label{cursor:pointer;font-weight:700;font-size:13px;padding:10px 12px;margin:4px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
  .disc-label:hover{border-color:var(--accent)}
  .code-proj{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:10px 14px;margin:10px 0}
  .code-proj summary{cursor:pointer;font-weight:600;padding:4px 0}
  .code-proj h4{margin:14px 0 6px;font-size:14px}
  .code-proj .traps,.code-proj .tip{margin-top:12px}
  code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:.5px 5px;font-size:.86em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}

  details.links{margin-top:24px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:2px 16px}
  details.links summary{cursor:pointer;font-size:14px;font-weight:600;padding:12px 0;list-style:none}
  details.links summary::-webkit-details-marker{display:none}
  details.links summary::before{content:"🔗 ";}
  details.links[open] summary{border-bottom:1px solid var(--line)}
  details.links ul{margin:10px 0 14px;padding-left:18px;font-size:13.5px}
  details.links li{margin:4px 0}

  .mark-read{display:flex;align-items:center;gap:12px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
  .mark-read button{
    background:var(--cardc,var(--accent));color:#fff;border:none;border-radius:10px;padding:11px 18px;
    font-size:14px;font-weight:600;cursor:pointer
  }
  .mark-read button.done{background:var(--good)}
  .nextprev{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
  .nextprev a{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--panel);font-size:13.5px}
  .nextprev a small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .nextprev a.next{text-align:right}

  .empty{color:var(--muted);text-align:center;padding:40px;font-size:14px}

  @media(max-width:860px){
    .layout{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;z-index:40;width:290px;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow)}
    .side.open{transform:translateX(0)}
    .topbar{display:flex}
    .theme-toggle{top:9px;right:14px;width:38px;height:38px}
    .wrap{padding:24px 18px 80px}
    .pc,.cola{grid-template-columns:1fr}
    .hero h2{font-size:25px}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;display:none}
    .scrim.show{display:block}
  }
</style>
</head>
<body>
<button class="theme-toggle" id="themeBtn" title="Alternar tema">🌗</button>
<div class="scrim" id="scrim"></div>
<div class="layout">
  <aside class="side" id="side">
    <div class="brand" onclick="goHome()">
      <div class="logo">🧠</div>
      <div><small>Central de Estudos</small><h1>Engenharia de IA Aplicada</h1></div>
    </div>
    <div class="search"><input id="search" placeholder="Buscar tópico ou termo…" autocomplete="off"></div>
    <div class="progress-wrap">
      <span id="progTxt"></span>
      <div class="bar"><i id="progBar"></i></div>
    </div>
    <nav id="nav"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <button id="menuBtn">☰</button>
      <strong style="font-size:14px" onclick="goHome()">Central de Estudos</strong>
    </div>
    <div class="wrap" id="content"></div>
  </main>
</div>

<script>window.STUDY=[];</script>
<script src="data/d01.js"></script>
<script src="data/d02.js"></script>
<script src="data/d03.js"></script>
<script src="data/d04.js"></script>
<script src="data/d05.js"></script>
<script src="data/d06.js"></script>
<script src="data/d07.js"></script>
<script src="data/d08.js"></script>
<script src="data/d09.js"></script>
<script src="data/d10.js"></script>
<script>
const COLORS = ["--b1","--b2","--b3","--b4","--b5","--b0"];
const DISCIPLINES = STUDY.slice().sort((a,b)=>a.disc.num.localeCompare(b.disc.num));
const BLOCKS = [];
const TOPICS = [];
DISCIPLINES.forEach(d=>{
  d.blocos.forEach((b,i)=>BLOCKS.push({...b, num:i, disc:d.disc.num, color:COLORS[i%COLORS.length]}));
  d.topics.forEach(t=>TOPICS.push({...t, disc:d.disc.num}));
});

const $ = s => document.querySelector(s);
const content = $("#content");
const nav = $("#nav");
const LS_READ = "eia_read_v1", LS_THEME = "eia_theme_v1";
const LEGACY_IDS = ["00","01","02","03","04","05","06","07","08","09","10","11"];

let read = new Set(JSON.parse(localStorage.getItem(LS_READ) || "[]").map(id=>LEGACY_IDS.includes(id)?"D1-"+id:id));
function saveRead(){ localStorage.setItem(LS_READ, JSON.stringify([...read])); }
saveRead();

let currentDisc = null;
function discOf(num){ return DISCIPLINES.find(d=>d.disc.num===num); }
function blockOf(t){ return BLOCKS.find(b=>b.id===t.bloco && b.disc===t.disc); }
function topicsOf(num){ return TOPICS.filter(t=>t.disc===num); }
function readCount(list){ return list.filter(t=>read.has(t.id)).length; }

function renderNav(filter=""){
  const f = filter.trim().toLowerCase();
  nav.innerHTML = "";
  const scope = f ? DISCIPLINES : DISCIPLINES.filter(d=>!currentDisc || d.disc.num===currentDisc);
  scope.forEach(d=>{
    if(!currentDisc || f){
      const head = document.createElement("div");
      head.className = "disc-label";
      head.textContent = `${d.disc.num} · ${d.disc.titulo}`;
      head.onclick = ()=>{ location.hash = "d/"+d.disc.num; closeSide(); };
      nav.appendChild(head);
      if(!f) return;
    }
    BLOCKS.filter(b=>b.disc===d.disc.num).forEach(bl=>{
      const items = TOPICS.filter(t=>t.disc===bl.disc && t.bloco===bl.id).filter(t=>{
        if(!f) return true;
        return (t.title+" "+t.short+" "+t.cola.map(c=>c[0]+" "+c[1]).join(" ")).toLowerCase().includes(f);
      });
      if(!items.length) return;
      const lab = document.createElement("div");
      lab.className = "bloco-label";
      lab.innerHTML = `<span class="dot" style="background:var(${bl.color})"></span> D${bl.disc} · Bloco ${bl.num} · ${bl.label}`;
      nav.appendChild(lab);
      items.forEach(t=>{
        const el = document.createElement("div");
        el.className = "nav-item"+(read.has(t.id)?" read":"")+(location.hash==="#"+t.id?" active":"");
        el.innerHTML = `<span class="num">${t.id.split("-")[1]}</span><span class="tt">${t.title}</span><span class="rd"></span>`;
        el.onclick = ()=>{ location.hash = t.id; closeSide(); };
        nav.appendChild(el);
      });
    });
  });
  if(currentDisc && !f){
    const back = document.createElement("div");
    back.className = "disc-label";
    back.textContent = "← Todas as disciplinas";
    back.onclick = ()=>{ location.hash = ""; closeSide(); };
    nav.prepend(back);
  }
  if(!nav.children.length) nav.innerHTML = `<div class="empty">Nada encontrado.</div>`;
  updateProgress();
}

function updateProgress(){
  const list = currentDisc ? topicsOf(currentDisc) : TOPICS;
  const n = readCount(list), total = list.length;
  $("#progTxt").textContent = `${n} de ${total} lidos${currentDisc?` · D${currentDisc}`:""}`;
  $("#progBar").style.width = (total ? n/total*100 : 0)+"%";
}

function li(arr, cls="clean"){ return `<ul class="${cls}">${arr.map(x=>`<li>${x}</li>`).join("")}</ul>`; }

function renderHome(){
  currentDisc = null;
  window.scrollTo(0,0);
  let html = `<div class="hero">
    <div class="eyebrow">Pós · Engenharia de IA Aplicada</div>
    <h2>Central de Estudos</h2>
    <p class="lead">Teoria das aulas e código do repositório oficial, juntos, disciplina por disciplina. Cada tópico traz o que é, como funciona, onde se aplica, prós e contras, armadilhas, o código explicado e uma analogia pra vovó entender.</p>
  </div><div class="cards">`;
  DISCIPLINES.forEach((d,i)=>{
    const list = topicsOf(d.disc.num), n = readCount(list);
    html += `<div class="card" style="--cardc:var(${COLORS[i%COLORS.length]})" onclick="location.hash='d/${d.disc.num}'">
      <div class="emoji">${d.disc.emoji||"📘"}</div>
      <h4>${d.disc.num} · ${d.disc.titulo}</h4>
      <p>${d.disc.autor} · ${d.blocos.length} blocos · ${list.length} tópicos</p>
      <div class="meta"><span>${n} de ${list.length} lidos</span>${n===list.length&&n?' · <span class="read-badge">✓ concluída</span>':''}</div>
    </div>`;
  });
  html += `</div>`;
  content.innerHTML = html;
  renderNav($("#search").value);
}

function renderDisc(num){
  const d = discOf(num);
  if(!d){ renderHome(); return; }
  currentDisc = num;
  window.scrollTo(0,0);
  let html = `<div class="crumb"><a onclick="goHome()">Central</a> › <span>Disciplina ${num}</span></div>
  <div class="hero">
    <div class="eyebrow">Disciplina ${num}</div>
    <h2>${d.disc.titulo}</h2>
    ${d.disc.resumo?`<p class="lead">${d.disc.resumo}</p>`:""}
    <div class="disc-tag"><b>${d.disc.autor}</b> ${d.topics.length} tópicos · ${readCount(topicsOf(num))} lidos</div>
  </div>`;
  BLOCKS.filter(b=>b.disc===num).forEach(bl=>{
    const items = TOPICS.filter(t=>t.disc===num && t.bloco===bl.id);
    if(!items.length) return;
    html += `<div class="bloco-section">
      <div class="bloco-head"><span class="dot" style="background:var(${bl.color})"></span>
        <h3>Bloco ${bl.num}</h3><small>${bl.label}</small></div>
      <div class="cards">`;
    items.forEach(t=>{
      html += `<div class="card" style="--cardc:var(${bl.color})" onclick="location.hash='${t.id}'">
        <div class="emoji">${t.emoji}</div>
        <h4>${t.title}</h4>
        <p>${t.short}</p>
        <div class="meta"><span>#${t.id}</span> · <span>${t.read}</span>${t.codigo&&t.codigo.length?' · <span>💻 código</span>':''}${read.has(t.id)?' · <span class="read-badge">✓ lido</span>':''}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  if(d.materiais && d.materiais.length){
    html += `<div class="materials"><h3>🧰 Materiais oficiais da disciplina</h3><ul>`;
    d.materiais.forEach(([label,url])=>{
      html += `<li>${url?`<a href="${url}" target="_blank" rel="noopener">${label}</a>`:label}</li>`;
    });
    html += `</ul></div>`;
  }
  if(d.aviso){
    html += `<div class="materials" style="border-left:4px solid var(--warn)"><h3>${d.aviso.titulo}</h3>
      <p style="margin:0;font-size:14px;color:var(--muted)">${d.aviso.texto}</p></div>`;
  }
  content.innerHTML = html;
  renderNav($("#search").value);
}

function renderCode(list){
  if(!list||!list.length) return "";
  return `<section class="blk"><h3><span class="ic">💻</span> No código do repo</h3>${list.map(c=>`
    <details class="code-proj"${list.length===1?" open":""}>
      <summary><code>${c.proj}</code></summary>
      <p>${c.resumo}</p>
      <h4>⚙️ Fluxo</h4>${li(c.fluxo,"steps")}
      <h4>▶️ Rodar e praticar</h4>${li(c.rodar)}
      ${c.templateVsZ?`<div class="tip">${c.templateVsZ}</div>`:""}
      ${c.armadilhas&&c.armadilhas.length?`<div class="traps"><h4>🚫 Armadilhas no código</h4><ul>${c.armadilhas.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
      ${c.link?`<p><a href="${c.link}" target="_blank" rel="noopener">Abrir no GitHub ↗</a></p>`:""}
    </details>`).join("")}</section>`;
}

function renderTopic(id){
  const t = TOPICS.find(x=>x.id===id);
  if(!t){ renderHome(); return; }
  currentDisc = t.disc;
  window.scrollTo(0,0);
  const bl = blockOf(t);
  const list = topicsOf(t.disc);
  const idx = list.indexOf(t);
  const prev = list[idx-1], next = list[idx+1];
  const isRead = read.has(t.id);

  let html = `<div style="--cardc:var(${bl.color})">
    <div class="crumb"><a onclick="goHome()">Central</a> › <a onclick="location.hash='d/${t.disc}'">Disciplina ${t.disc}</a> › <span>Bloco ${bl.num}</span></div>
    <div class="t-head">
      <div class="t-emoji">${t.emoji}</div>
      <div><h2>${t.title}</h2>
        <div class="badges"><span class="badge mod">${t.mod}</span><span class="badge">⏱ ${t.read}</span><span class="badge">#${t.id}</span></div>
      </div>
    </div>

    <div class="oneliner"><span class="k">Em uma frase</span>${t.oneliner}</div>

    <div class="vovo"><section class="blk" style="margin:0"><h3><span class="ic">👵</span> A analogia da vovó</h3>${t.vovo.map(p=>`<p>${p}</p>`).join("")}</section></div>

    <section class="blk"><h3><span class="ic">💡</span> O que é</h3>${li(t.oque)}</section>

    <section class="blk"><h3><span class="ic">⚙️</span> Como funciona</h3>${li(t.como,"steps")}</section>

    <section class="blk"><h3><span class="ic">🎯</span> Como se aplica</h3>${li(t.aplica)}</section>

    <section class="blk"><h3><span class="ic">⚖️</span> Prós e contras</h3>
      <div class="pc">
        <div class="col pro"><h4>👍 Prós</h4><ul>${t.pros.map(x=>`<li>${x}</li>`).join("")}</ul></div>
        <div class="col con"><h4>👎 Contras</h4><ul>${t.contras.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      </div>
    </section>

    <section class="blk"><div class="traps"><h3><span class="ic">🚫</span> Más práticas e armadilhas</h3><ul>${t.traps.map(x=>`<li>${x}</li>`).join("")}</ul></div></section>
    ${t.tip?`<section class="blk"><div class="tip">${t.tip}</div></section>`:""}

    ${t.curso?`<section class="blk"><h3><span class="ic">🛠️</span> No curso — mão na massa</h3><div class="tip" style="border-style:solid;border-color:var(--line)">${t.curso}</div></section>`:""}
    ${renderCode(t.codigo)}

    <section class="blk"><h3><span class="ic">🧩</span> Cola rápida</h3>
      <dl class="cola">${t.cola.map(([k,v])=>`<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
    </section>

    <details class="links"><summary>Para ir além</summary><ul>${t.links.map(([l,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${l}</a></li>`).join("")}</ul></details>

    <div class="mark-read">
      <button id="readBtn" class="${isRead?'done':''}" onclick="toggleRead('${t.id}')">${isRead?'✓ Lido':'Marcar como lido'}</button>
      <span style="color:var(--muted);font-size:13px">Seu progresso fica salvo neste navegador.</span>
    </div>

    <div class="nextprev">
      ${prev?`<a onclick="location.hash='${prev.id}'"><small>← Anterior</small>${prev.title}</a>`:`<span></span>`}
      ${next?`<a class="next" onclick="location.hash='${next.id}'"><small>Próximo →</small>${next.title}</a>`:`<span></span>`}
    </div>
  </div>`;

  content.innerHTML = html;
  renderNav($("#search").value);
}

function toggleRead(id){
  if(read.has(id)) read.delete(id); else read.add(id);
  saveRead();
  renderTopic(id);
}

function goHome(){ if(location.hash){ location.hash=""; } else { renderHome(); } }
function route(){
  const h = decodeURIComponent(location.hash.replace("#",""));
  if(!h) return renderHome();
  if(h.startsWith("d/")) return renderDisc(h.slice(2));
  if(LEGACY_IDS.includes(h)){ location.replace("#D1-"+h); return; }
  renderTopic(h);
}

function closeSide(){ $("#side").classList.remove("open"); $("#scrim").classList.remove("show"); }
$("#menuBtn").onclick = ()=>{ $("#side").classList.toggle("open"); $("#scrim").classList.toggle("show"); };
$("#scrim").onclick = closeSide;

$("#search").addEventListener("input", e=>renderNav(e.target.value));

function applyTheme(t){
  if(t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
let theme = localStorage.getItem(LS_THEME) || "";
applyTheme(theme);
$("#themeBtn").onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur === "dark" || (!cur && matchMedia("(prefers-color-scheme:dark)").matches);
  theme = isDark ? "light" : "dark";
  localStorage.setItem(LS_THEME, theme);
  applyTheme(theme);
};

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
