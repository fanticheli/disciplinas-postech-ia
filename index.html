<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Estudos · Pós Engenharia de IA Aplicada</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1a1d24; --muted:#5c6470; --line:#e6e8ec;
    --accent:#4f46e5; --accent-soft:#eef0fe;
    --good:#0f9d58; --good-soft:#e7f6ee; --bad:#d93838; --bad-soft:#fdeceb;
    --warn:#b7791f; --warn-soft:#fdf3e2; --vovo:#c026a3; --vovo-soft:#fbeaf6;
    --shadow:0 1px 2px rgba(20,25,40,.06),0 8px 24px rgba(20,25,40,.06);
    --radius:14px;
    --b0:#64748b; --b1:#4f46e5; --b2:#0d9488; --b3:#7c3aed; --b4:#d97706; --b5:#e11d48;
  }
  :root[data-theme="dark"]{
    --bg:#0e1016; --panel:#171a22; --ink:#e8eaee; --muted:#9aa2b1; --line:#262a35;
    --accent:#818cf8; --accent-soft:#20233a;
    --good:#3ecf8e; --good-soft:#13251d; --bad:#f87171; --bad-soft:#2a1717;
    --warn:#eab355; --warn-soft:#2a2314; --vovo:#f0a6dc; --vovo-soft:#2a1626;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    --b0:#94a3b8; --b1:#818cf8; --b2:#2dd4bf; --b3:#a78bfa; --b4:#fbbf24; --b5:#fb7185;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0e1016; --panel:#171a22; --ink:#e8eaee; --muted:#9aa2b1; --line:#262a35;
      --accent:#818cf8; --accent-soft:#20233a;
      --good:#3ecf8e; --good-soft:#13251d; --bad:#f87171; --bad-soft:#2a1717;
      --warn:#eab355; --warn-soft:#2a2314; --vovo:#f0a6dc; --vovo-soft:#2a1626;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
      --b0:#94a3b8; --b1:#818cf8; --b2:#2dd4bf; --b3:#a78bfa; --b4:#fbbf24; --b5:#fb7185;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  .layout{display:grid;grid-template-columns:300px 1fr;min-height:100vh}

  /* ---------- Sidebar ---------- */
  .side{
    background:var(--panel);border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;cursor:pointer}
  .brand h1{font-size:15px;margin:0;line-height:1.25}
  .brand small{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--b1),var(--b3));
    display:grid;place-items:center;font-size:18px;flex:0 0 auto}

  .search{position:relative;margin:6px 6px 14px}
  .search input{
    width:100%;padding:9px 12px 9px 32px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--ink);font-size:13.5px;outline:none
  }
  .search input:focus{border-color:var(--accent)}
  .search::before{content:"🔎";position:absolute;left:10px;top:8px;font-size:12px;opacity:.6}

  .progress-wrap{margin:0 6px 16px;font-size:12px;color:var(--muted)}
  .bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b1),var(--b2));transition:width .3s}

  .bloco-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin:16px 8px 6px;display:flex;align-items:center;gap:7px}
  .bloco-label .dot{width:8px;height:8px;border-radius:99px}

  .nav-item{
    display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;
    color:var(--ink);font-size:13.5px;border:1px solid transparent
  }
  .nav-item:hover{background:var(--bg)}
  .nav-item.active{background:var(--accent-soft);border-color:var(--line);font-weight:600}
  .nav-item .num{font-size:11px;font-weight:700;color:var(--muted);min-width:20px}
  .nav-item .tt{flex:1;line-height:1.25}
  .nav-item .rd{width:15px;height:15px;border-radius:99px;border:1.5px solid var(--line);flex:0 0 auto}
  .nav-item.read .rd{background:var(--good);border-color:var(--good)}
  .nav-item.read .rd::after{content:"✓";color:#fff;font-size:10px;display:grid;place-items:center;height:100%;margin-top:-1px}

  /* ---------- Main ---------- */
  .main{padding:0}
  .topbar{
    display:none;position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
    padding:10px 16px;align-items:center;gap:12px
  }
  .topbar button{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 11px;font-size:15px;cursor:pointer}
  .wrap{max-width:860px;margin:0 auto;padding:40px 32px 90px}

  .theme-toggle{position:fixed;top:16px;right:20px;z-index:30;background:var(--panel);border:1px solid var(--line);
    color:var(--ink);border-radius:99px;width:40px;height:40px;font-size:17px;cursor:pointer;box-shadow:var(--shadow)}

  /* Home */
  .hero{margin-bottom:8px}
  .eyebrow{color:var(--accent);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em}
  .hero h2{font-size:30px;line-height:1.15;margin:8px 0 10px;letter-spacing:-.02em}
  .hero p.lead{font-size:17px;color:var(--muted);margin:0;max-width:640px}
  .disc-tag{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:var(--panel);
    border:1px solid var(--line);border-radius:99px;padding:6px 14px 6px 8px;font-size:13px;box-shadow:var(--shadow)}
  .disc-tag b{background:linear-gradient(135deg,var(--b1),var(--b3));color:#fff;border-radius:99px;padding:2px 10px;font-size:12px}

  .bloco-section{margin-top:34px}
  .bloco-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .bloco-head .dot{width:11px;height:11px;border-radius:99px}
  .bloco-head h3{margin:0;font-size:15px}
  .bloco-head small{color:var(--muted);font-size:13px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;
    box-shadow:var(--shadow);transition:transform .12s,border-color .12s;position:relative;overflow:hidden
  }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cardc,var(--b1))}
  .card:hover{transform:translateY(-2px);border-color:var(--cardc,var(--accent))}
  .card .emoji{font-size:22px}
  .card h4{margin:8px 0 5px;font-size:15px;line-height:1.25}
  .card p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
  .card .meta{display:flex;gap:8px;align-items:center;margin-top:11px;font-size:11.5px;color:var(--muted)}
  .card .read-badge{color:var(--good);font-weight:600}

  .materials{margin-top:40px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
  .materials h3{margin:0 0 12px;font-size:15px}
  .materials ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
  .materials li{margin:5px 0}

  /* Topic detail */
  .crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:18px}
  .crumb a{cursor:pointer}
  .t-head{display:flex;gap:14px;align-items:flex-start}
  .t-emoji{font-size:34px;line-height:1;margin-top:2px}
  .t-head h2{margin:0 0 6px;font-size:26px;letter-spacing:-.02em;line-height:1.15}
  .badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .badge{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
  .badge.mod{background:var(--cardc,var(--b1));color:#fff;border-color:transparent}

  .oneliner{background:var(--accent-soft);border:1px solid var(--line);border-left:4px solid var(--cardc,var(--accent));
    border-radius:12px;padding:16px 18px;margin:24px 0;font-size:16.5px;line-height:1.5}
  .oneliner .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cardc,var(--accent));display:block;margin-bottom:5px}

  section.blk{margin:26px 0}
  section.blk > h3{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:9px}
  section.blk > h3 .ic{font-size:18px}
  ul.clean{list-style:none;margin:0;padding:0}
  ul.clean li{position:relative;padding:6px 0 6px 26px;font-size:15px;line-height:1.55;border-bottom:1px solid var(--line)}
  ul.clean li:last-child{border-bottom:none}
  ul.clean li::before{content:"›";position:absolute;left:6px;top:5px;color:var(--accent);font-weight:800}
  ul.steps{counter-reset:s;list-style:none;margin:0;padding:0}
  ul.steps li{position:relative;padding:7px 0 7px 34px;font-size:15px;line-height:1.55;border-bottom:1px solid var(--line)}
  ul.steps li:last-child{border-bottom:none}
  ul.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:7px;
    width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);
    font-size:12px;font-weight:700;display:grid;place-items:center}

  .vovo{background:var(--vovo-soft);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .vovo h3{color:var(--vovo)}
  .vovo p{margin:0;font-size:15.5px;line-height:1.6}
  .vovo p + p{margin-top:10px}

  .pc{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pc .col{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .pc .col.pro{background:var(--good-soft)}
  .pc .col.con{background:var(--bad-soft)}
  .pc .col h4{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:7px}
  .pc .col.pro h4{color:var(--good)} .pc .col.con h4{color:var(--bad)}
  .pc ul{list-style:none;margin:0;padding:0}
  .pc li{font-size:14px;line-height:1.5;padding:4px 0 4px 18px;position:relative}
  .pc .col.pro li::before{content:"+";position:absolute;left:2px;color:var(--good);font-weight:800}
  .pc .col.con li::before{content:"–";position:absolute;left:2px;color:var(--bad);font-weight:800}

  .traps{background:var(--warn-soft);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:14px 18px}
  .traps h3{color:var(--warn)}
  .traps ul{list-style:none;margin:0;padding:0}
  .traps li{font-size:14.5px;line-height:1.55;padding:5px 0 5px 24px;position:relative}
  .traps li::before{content:"⚠";position:absolute;left:0;top:5px;font-size:12px}

  .tip{background:var(--panel);border:1px dashed var(--accent);border-radius:12px;padding:13px 16px;font-size:14.5px}
  .tip b{color:var(--accent)}

  .cola{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
  .cola .row{border-bottom:1px solid var(--line);padding:7px 0;font-size:14px}
  .cola .row dt{font-weight:700;color:var(--ink)}
  .cola .row dd{margin:2px 0 0;color:var(--muted);font-size:13.5px}
  code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:.5px 5px;font-size:.86em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  details.links{margin-top:24px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:2px 16px}
  details.links summary{cursor:pointer;font-size:14px;font-weight:600;padding:12px 0;list-style:none}
  details.links summary::-webkit-details-marker{display:none}
  details.links summary::before{content:"🔗 ";}
  details.links[open] summary{border-bottom:1px solid var(--line)}
  details.links ul{margin:10px 0 14px;padding-left:18px;font-size:13.5px}
  details.links li{margin:4px 0}

  .mark-read{display:flex;align-items:center;gap:12px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
  .mark-read button{
    background:var(--cardc,var(--accent));color:#fff;border:none;border-radius:10px;padding:11px 18px;
    font-size:14px;font-weight:600;cursor:pointer
  }
  .mark-read button.done{background:var(--good)}
  .nextprev{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
  .nextprev a{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--panel);font-size:13.5px}
  .nextprev a small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .nextprev a.next{text-align:right}

  .empty{color:var(--muted);text-align:center;padding:40px;font-size:14px}

  @media(max-width:860px){
    .layout{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;z-index:40;width:290px;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow)}
    .side.open{transform:translateX(0)}
    .topbar{display:flex}
    .theme-toggle{top:9px;right:14px;width:38px;height:38px}
    .wrap{padding:24px 18px 80px}
    .pc,.cola{grid-template-columns:1fr}
    .hero h2{font-size:25px}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;display:none}
    .scrim.show{display:block}
  }
</style>
</head>
<body>
<button class="theme-toggle" id="themeBtn" title="Alternar tema">🌗</button>
<div class="scrim" id="scrim"></div>
<div class="layout">
  <aside class="side" id="side">
    <div class="brand" onclick="goHome()">
      <div class="logo">🧠</div>
      <div><small>Central de Estudos</small><h1>Engenharia de IA Aplicada</h1></div>
    </div>
    <div class="search"><input id="search" placeholder="Buscar tópico ou termo…" autocomplete="off"></div>
    <div class="progress-wrap">
      <span id="progTxt">0 de 12 lidos</span>
      <div class="bar"><i id="progBar"></i></div>
    </div>
    <nav id="nav"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <button id="menuBtn">☰</button>
      <strong style="font-size:14px" onclick="goHome()">Central de Estudos</strong>
    </div>
    <div class="wrap" id="content"></div>
  </main>
</div>

<script>
/* ===================== DADOS ===================== */
const BLOCOS = [
  {id:0,label:"Antes de começar",cor:"--b0"},
  {id:1,label:"A base — o que é IA de verdade",cor:"--b1"},
  {id:2,label:"Visão computacional e IA que aprende sozinha",cor:"--b2"},
  {id:3,label:"O coração dos LLMs",cor:"--b3"},
  {id:4,label:"Trabalhando com LLMs no dia a dia",cor:"--b4"},
  {id:5,label:"Rodando e alimentando modelos",cor:"--b5"},
];

const TOPICS = [
{
  id:"00", bloco:0, mod:"Módulo 1", emoji:"🚀", read:"5 min",
  title:"Introdução ao curso — a proposta e como estudar",
  short:"Uma pós que forma devs que aplicam IA, não cientistas de dados.",
  oneliner:"Esta pós <b>não forma cientistas de dados</b> — forma <b>desenvolvedores</b> que usam IA no dia a dia, com foco total em prática, usando <b>JavaScript</b> para rodar IA direto no navegador e em projetos locais.",
  vovo:[
    "Imagine uma escola de culinária. Um curso ensina a <b>química dos alimentos</b> (a fórmula da fermentação); o outro ensina a <b>cozinhar de verdade</b> — pôr a mão na massa e servir o prato. Este curso é o segundo tipo: não afunda você em matemática pesada, ensina a <b>usar as ferramentas</b> pra resolver problemas reais.",
    "E tem a regra de ouro que a vovó conhece: <b>não adianta só assistir</b>. Aprender a cozinhar vendo vídeo não enche barriga de ninguém — tem que ir pro fogão, errar o ponto, repetir."
  ],
  oque:["Curso focado na <b>aplicação</b> de IA por desenvolvedores — entender conceitos e boas práticas, não derivar a matemática.","Entregável: <b>+12 projetos práticos</b> com potencial de uso real em empresas, produto e portfólio.","Base técnica: <b>TensorFlow.js</b> e JavaScript/Node — aplicar IA sem trocar de stack."],
  como:["<b>Por que JS e não Python?</b> É a linguagem nativa do navegador — todo dev cedo ou tarde encosta nela.","Roda IA <b>no cliente</b>: modelos, áudio e vídeo sem custo extra de servidor e com boa performance.","Dá <b>autonomia</b>: você deixa de só integrar APIs de terceiros e passa a rodar IA com controle.","<b>Ponte com Python</b>: o TensorFlow.js também porta modelos treinados em Python pro navegador/Node."],
  aplica:["Pegue cada exemplo e adapte a outro contexto (processou imagem? tente áudio ou vídeo).","Desenvolva um <b>projeto pessoal</b> como fio condutor — vira portfólio e networking.","Leia o material complementar e participe da comunidade (o aprendizado real vem do problema real)."],
  pros:["Aprende fazendo, com projetos reais","Roda local/offline, sem custo de servidor","Gera portfólio aplicável ao mercado"],
  contras:["Exige disciplina de praticar, não só assistir","Não aprofunda a matemática por trás dos modelos"],
  traps:["Consumir o curso de forma passiva (só assistir e não codar)","Pular a prática e o material complementar","Achar que vídeo assistido = conhecimento fixado"],
  cola:[["Foco do curso","Aplicar IA como dev, não fazer ciência de dados"],["TensorFlow.js","Roda ML no navegador e no Node; porta modelos do Python"],["Web 4.0","Geração da web com IA nativa ao navegador (roda local)"],["Aprendizado ativo","Praticar, adaptar e compartilhar — não apenas assistir"]],
  links:[["Repositório oficial da disciplina","https://github.com/unipds-engenharia-de-ia-aplicada"],["Pac-Man com transfer learning (demo)","https://storage.googleapis.com/tfjs-examples/webcam-transfer-learning/dist/index.html"],["ML vs Deep Learning (visão geral)","https://www.datacamp.com/tutorial/machine-deep-learning"]]
},
{
  id:"01", bloco:1, mod:"Módulo 2", emoji:"🧩", read:"9 min",
  title:"Machine Learning, Deep Learning e IA",
  short:"IA ⊃ ML ⊃ DL: a base que costuma se confundir.",
  oneliner:"<b>IA</b> é o guarda-chuva de qualquer sistema que resolve tarefas “inteligentes”; <b>Machine Learning</b> é o pedaço que aprende com exemplos em vez de regras escritas à mão; e <b>Deep Learning</b> é o ML turbinado com <b>redes neurais</b> de muitas camadas.",
  vovo:[
    "Quer ensinar alguém a reconhecer uma laranja. <b>Jeito antigo (regras):</b> “se for redonda E laranja E do tamanho de um punho…” — mas uma tangerina quebra a regra, uma laranja verde quebra a regra. Você nunca termina de escrever exceções.",
    "<b>Machine Learning:</b> em vez de regras, mostra <b>mil fotos</b> de laranjas e mil de outras frutas. A criança descobre o padrão sozinha e acerta em frutas que nunca viu. <b>Deep Learning</b> é a mesma ideia com um “cérebro” de várias camadas: uma vê bordas, outra formas, outra textura, a última decide.",
    "O “neurônio artificial” é só uma <b>mini calculadora</b>: recebe números, faz uma continha e passa adiante. Junte milhares e vira uma rede que aprende. Apesar do nome, <b>não é um cérebro</b> — é matemática com nome bonito."
  ],
  oque:["<b>IA:</b> qualquer algoritmo que executa tarefas que “exigiriam inteligência”.","<b>ML:</b> subárea que troca regras manuais por <b>padrões aprendidos de dados</b> — ganha em flexibilidade, escala e adaptabilidade.","<b>DL:</b> ML com <b>redes neurais profundas</b>; cada camada empilhada aprende representações mais abstratas (resolve bem visão, voz, movimento)."],
  como:["Rede = <b>entrada</b> (dados virados número) → <b>camadas ocultas</b> (cada neurônio combina entradas, aplica <b>pesos</b> + função de ativação tipo ReLU) → <b>saída</b> (probabilidade por categoria, ex. Softmax).","<b>Treinar</b> = mostrar exemplos rotulados, medir o erro (<b>loss</b>) e ajustar os pesos, repetindo por várias <b>epochs</b>.","Todo dado vira <b>tensor</b>: normalização escala valores pra 0–1 <code>(valor-min)/(max-min)</code>; <b>one-hot</b> transforma categorias em vetores binários.","<b>Mais dados + mais diversidade = melhor generalização</b> (o sensor LEM do Google treinou com +60 milhões de horas)."],
  aplica:["Classificar imagens, gestos e voz por exemplos em vez de regras (ex. gesto no smartwatch).","<b>Teachable Machine</b>: treinar um classificador pela webcam sem escrever código.","<b>Transfer learning</b>: reaproveitar um modelo pronto e refinar com poucos dados (ex. Pac-Man controlado pelo rosto)."],
  pros:["Generaliza para dados nunca vistos","Resolve o que regras manuais não dão conta","Flexível, escalável e adaptável"],
  contras:["Precisa de muitos dados variados e representativos","Comporta-se como “caixa-preta”","Treino tem custo computacional real"],
  traps:["Treinar com poucos dados ou dados enviesados","Esquecer a normalização — uma feature domina pela escala","Tratar categoria como número (sem one-hot), criando ordem que não existe","Achar que o modelo “decorou” — o valor está em <b>generalizar</b>"],

{
  id:"02", bloco:1, mod:"Módulo 3", emoji:"🛒", read:"10 min",
  title:"Sistemas de Recomendação na prática",
  short:"Estimar a probabilidade de cada cliente comprar cada produto.",
  oneliner:"Um sistema de recomendação é uma rede neural que aprende, a partir do histórico, a <b>estimar a probabilidade</b> de cada cliente comprar cada produto — e ordena o catálogo do “mais provável” ao “menos provável”, inclusive para clientes <b>novos</b>, sem histórico.",
  vovo:[
    "Pensa no feirante que você frequenta há anos: ele já sabe que você leva tomate, manjericão e uma fruta da estação — recomendação pelo <b>seu histórico</b>. Chega um cliente <b>novo</b> que ele nunca viu: ele repara “esse tem o jeito dos que levam café e pão na chapa” e sugere isso. Na falta do histórico, usa o comportamento de <b>gente parecida</b>.",
    "É isso que o sistema faz, com matemática: para cada par <i>(cliente, produto)</i> dá uma nota de 0 a 1 — a chance de comprar — e ordena do maior pro menor. E tudo roda <b>dentro do navegador</b>."
  ],
  oque:["Objetivo: <b>ranquear produtos pela probabilidade de compra</b> de cada usuário.","Para clientes sem histórico (<b>cold start</b>), usa o comportamento de perfis semelhantes (a idade puxa o resto).","Roda 100% no navegador — treino e predição no cliente."],
  como:["<b>Codificar produto</b> num vetor normalizado, com <b>peso por atributo</b>: categoria (maior) &gt; cor &gt; preço &gt; idade. Categorias/cores viram one-hot com multiplicador.","<b>Codificar usuário</b> = média dos vetores dos produtos que ele comprou (um “perfil de compra” resumido).","<b>Treino:</b> pares (usuário, produto) rotulados 1 (comprou) ou 0. Rede densa <b>128 → 64 → 32 → 1</b> com saída <b>Sigmoid</b>; otimizador Adam, loss binaryCrossentropy.","<b>Web Worker</b> treina em segundo plano (não trava a UI); <b>tfvis</b> plota loss e acurácia em tempo real.","<b>Predição:</b> concatena o vetor do usuário com o de cada produto, prevê e <b>ordena</b>."],
  aplica:["E-commerce, filmes, artigos, cursos — mesmo motor, troca-se o domínio.","Em produção, a comparação “todos-com-todos” não escala: use um <b>banco vetorial</b> (Pinecone, ChromaDB, pgvector) que devolve só os <b>top-N</b> mais próximos."],
  pros:["Personaliza sem escrever regras","Funciona para clientes novos (perfis similares)","Aprendizado observável em tempo real (tfvis)"],
  contras:["Comparar todos-com-todos é inviável em escala","Qualidade depende muito da codificação e dos pesos","Cold start é uma aproximação (só idade)"],
  traps:["Rodar o treino na thread principal — trava a interface (use Web Worker)","Comparar todos os usuários com todos os produtos em escala (use banco vetorial)","Pesos de atributo mal calibrados distorcem o ranking","Ignorar normalização e fallback quando faltam dados"],
  cola:[["Web Worker","Thread secundária: treina sem travar a interface"],["tfvis","Plota loss/acurácia em tempo real"],["Peso do atributo","Multiplicador de importância (categoria/cor/preço/idade)"],["Sigmoid","Ativação que devolve probabilidade 0–1"],["binaryCrossentropy","Loss para problemas de sim/não"],["Cold start","Recomendar para usuário novo, sem histórico"],["Banco vetorial","Indexa vetores e retorna os top-N mais próximos"]],
  links:[["Recommenders (Microsoft)","https://github.com/recommenders-team/recommenders"],["Guia de recomendação (Databricks)","https://www.databricks.com/blog/guide-to-building-online-recommendation-system"],["Spotify + Reinforcement Learning","https://blog.tensorflow.org/2023/10/simulated-spotify-listening-experiences-reinforcement-learning-tensorflow-tf-agents.html"]]
},
{
  id:"03", bloco:2, mod:"Módulo 4", emoji:"🎯", read:"9 min",
  title:"Visão computacional na Web — vencendo jogos com YOLO",
  short:"Integrar um modelo pronto de detecção em vez de treinar do zero.",
  oneliner:"Nem sempre é preciso treinar um modelo: aqui a IA <b>integra um modelo pronto de detecção de objetos (YOLO)</b> para enxergar a tela de um jogo, identificar os alvos e disparar sozinha — tudo no navegador.",
  vovo:[
    "Em vez de criar um cão de caça filhote e passar meses adestrando, você <b>contrata um cão já treinado</b> e só ensina onde mirar. Esse “cão treinado” é o <b>YOLO</b>: olha uma foto e aponta num piscar de olhos <i>onde</i> está cada coisa.",
    "A IA tira uma “foto” da tela várias vezes por segundo, pergunta “onde está o pato?”, pega as coordenadas e clica ali. Detalhe engraçado: o YOLO nunca aprendeu “pato de videogame”, então chama o pato de <b>“pipa” (kite)</b>. Não é perfeito, mas acha o alvo no lugar certo."
  ],
  oque:["Muda o foco: em vez de <b>treinar</b>, o objetivo é <b>integrar</b> modelos prontos, Web APIs e bibliotecas de JS.","<b>YOLO (You Only Look Once):</b> detecção de objetos — retorna o que e onde está cada item, com 80+ categorias.","Treinado em PyTorch, <b>convertido para TensorFlow.js</b> e executado no browser."],
  como:["<b>Capturar</b> a tela do canvas com <code>createImageBitmap</code>.","Enviar a imagem a um <b>Web Worker</b> (a thread principal nunca roda o modelo direto).","<b>Pré-processar</b> dentro de <code>tf.tidy</code>: bitmap → tensor, resize para 640×640, normalizar (/255), adicionar dimensão de batch.","<b>Inferir</b> com <code>executeAsync</code> → retorna boxes, scores e classes.","<b>Filtrar</b> por confiança (threshold 40%) e classe, calcular o <b>centro da caixa</b>, mover a mira e simular o clique.","<b>Warm-up</b>: uma predição inicial “boba” pré-carrega o modelo e acelera as próximas."],
  aplica:["Automação de jogos; monitoramento; robótica; navegação autônoma.","Trocando o alvo/label: detectar <b>prateleiras vazias</b> em supermercado, contar objetos, vigiar cenas."],
  pros:["Entrega rápida — sem meses de treino","Reaproveita inteligência pronta e robusta","Roda no navegador, sem servidor"],
  contras:["Os labels podem não bater com seu domínio (o “kite”)","Depende da qualidade do modelo pronto","Cada frame tem custo de inferência"],
  traps:["Rodar o modelo na thread principal (trava a UI)","Esquecer o <code>tf.tidy</code> → vazamento de memória de tensores","Pular o warm-up e sofrer com a primeira inferência lenta","Threshold mal ajustado → falsos positivos/negativos"],
  cola:[["YOLO","Modelo de detecção de objetos (You Only Look Once)"],["Detecção de objetos","Achar o que e onde está cada item na imagem"],["Bounding box","Caixa (x1,y1,x2,y2) que delimita o objeto"],["classThreshold","Corte mínimo de confiança (aqui, 40%)"],["tf.tidy","Libera automaticamente a memória dos tensores temporários"],["Warm-up","Predição inicial para pré-carregar o modelo"],["executeAsync","Roda a inferência do grafo do modelo"]],
  links:[["YOLOv5 (Ultralytics)","https://github.com/ultralytics/yolov5"],["YOLOv7 no navegador com TF.js","https://medium.com/data-science/training-a-custom-yolov7-in-pytorch-and-running-it-directly-in-the-browser-with-tensorflow-js-96a5ecd7a530"],["Detecção de SKUs no browser (Hugo Zanini)","https://blog.tensorflow.org/2022/05/real-time-sku-detection-in-browser.html"]]
},
{
  id:"04", bloco:2, mod:"Módulo 5 · Cap.1", emoji:"🧬", read:"8 min",
  title:"Algoritmos Genéticos e Aprendizado por Reforço",
  short:"Dois jeitos de a IA achar solução sozinha, sem resposta pronta.",
  oneliner:"São dois jeitos de a IA <b>descobrir soluções sozinha</b> quando ninguém sabe a resposta: <b>algoritmos genéticos</b> imitam a evolução (evoluem uma população de tentativas) e <b>aprendizado por reforço</b> imita o adestramento (um agente aprende por tentativa, erro e recompensa).",
  vovo:[
    "Lembra de cruzar roseiras pra tentar uma flor mais bonita? Pega as duas plantas mais fortes, cruza, e da nova geração escolhe de novo as melhores. Depois de gerações, sai uma rosa que você nunca conseguiria desenhar na mão. <b>Isso é um algoritmo genético</b> — a IA cria centenas de tentativas, deixa competir, mistura as melhores (crossover) e joga uma pitada de novidade (mutação).",
    "E o <b>aprendizado por reforço</b> é adestrar o cachorro com petisco: senta certo, ganha petisco; faz bagunça, não ganha nada. No jogo da cobrinha, a IA ganha ponto comendo a fruta e perde batendo na parede — e fica boa só por recompensa e castigo."
  ],
  oque:["<b>Genéticos:</b> trabalham com uma <b>população de soluções candidatas</b> que evolui — não aprendem em sequência.","<b>Reforço (RL):</b> um <b>agente</b> toma decisões sequenciais para <b>maximizar uma recompensa acumulada</b>, por tentativa e erro.","Diferença central: genético = evoluir vários candidatos ao mesmo tempo; reforço = treinar um único agente, passo a passo."],
  como:["<b>Ciclo genético:</b> avaliar (fitness) → selecionar os melhores → cruzar (crossover) → mutar → nova geração; repetir.","A <b>taxa de mutação</b> é o parâmetro crítico: alta = caos (exploração demais); baixa = estagnação; equilibrada = explora sem perder o que já funciona.","<b>RL:</b> cada movimento gera uma pontuação; o agente é recompensado por acertos e penalizado por erros, e ajusta o comportamento a partir disso.","O resultado do genético costuma ser <b>criativo e inesperado</b> — formas que nenhum humano projetaria, mas que funcionam (prioriza desempenho, não estética)."],
  aplica:["Muito além de jogos: engenharia, logística, design de circuitos, otimização de processos.","Demos: carros que evoluem geração a geração, IA que estaciona sozinha (até com drift), dino do Chrome, SnakeAI."],
  pros:["Acham soluções criativas que humano não projetaria","Não precisam de dados rotulados","O agente aprende a estratégia sozinho"],
  contras:["Custam muitas iterações e tempo","Muito sensíveis ao ajuste de parâmetros","Recompensa/fitness mal definida leva a comportamento errado"],
  traps:["Taxa de mutação mal calibrada (caos ou estagnação)","Função de recompensa/fitness mal desenhada","Confundir “reconhecer” (YOLO, doc 03) com “aprender estratégia” — no Duck Hunt <b>não havia aprendizado real</b>"],
  cola:[["População","Conjunto de soluções candidatas avaliadas em paralelo"],["Fitness","Nota que mede quão boa é uma solução"],["Crossover","Cruzar características dos melhores indivíduos"],["Mutação","Alteração aleatória para introduzir novidade"],["Geração","Uma rodada completa de avaliação + reprodução"],["Agente (RL)","Entidade que toma decisões buscando recompensa"],["Recompensa","Sinal de acerto/erro que guia o aprendizado"]],
  links:[["Genetic Cars (simulador)","https://rednuht.org/genetic_cars_2/"],["Neuroevolution com TensorFlow.js","https://medium.com/codesphere-cloud/teaching-cars-to-drive-with-neuroevolution-tensorflow-and-500-lines-of-javascript-57888956322e"],["Cart-pole (RL no navegador)","https://storage.googleapis.com/tfjs-examples/cart-pole/dist/index.html"],["SnakeAI","https://github.com/jonatan5524/SnakeAI"]]
},
{
  id:"05", bloco:3, mod:"Módulo 5 · Cap.2", emoji:"⭐", read:"12 min",
  title:"Como funcionam LLMs — transformers, embeddings, attention",
  short:"O doc central: o que faz o ChatGPT funcionar por dentro.",
  oneliner:"Um <b>LLM</b> é um autocompletar gigante: quebra o texto em <b>tokens</b>, transforma cada um em um <b>vetor de significado</b> (embedding), usa <b>attention</b> para entender o contexto inteiro, e gera a resposta <b>um token por vez</b>, sempre escolhendo o próximo mais provável.",
  vovo:[
    "Sabe o <b>autocompletar do celular</b> que sugere a próxima palavra? Um LLM é isso no extremo: em vez de uma palavrinha, escreve textos inteiros, sempre adivinhando “qual a próxima palavra mais provável”.",
    "Como ele “entende” as palavras? Transforma cada pedaço de texto num <b>ponto num mapa gigante</b> onde ideias parecidas ficam pertinho — dá até pra fazer conta: <i>Rei − Homem + Mulher = Rainha</i>. E pra não se perder numa frase longa, toda vez ele <b>relê a frase inteira</b> (isso é o <b>attention</b>).",
    "Aviso da vovó: <b>o LLM não sabe o que é verdade.</b> Ele escolhe a palavra mais provável. Se faltar informação, chuta com confiança — e às vezes inventa (a <b>alucinação</b>). Quanto melhor a pergunta e mais contexto, melhor a resposta."
  ],
  oque:["<b>GPT</b> = Generative (gera texto) + Pre-trained (treinado antes com muito texto) + Transformer (a arquitetura que torna tudo possível).","O funcionamento tem <b>5 componentes</b>: tokenização, embeddings, transformer/attention, probabilidades/decoding e geração passo a passo."],
  como:["<b>1. Tokenização:</b> o texto é quebrado em <b>tokens</b> (≠ palavras — podem ser pedaços). “4.000 tokens” não são 4.000 palavras — e isso afeta custo direto.","<b>2. Embeddings:</b> cada token vira um <b>vetor de significado</b>; relações viram direções no espaço (Rei − Homem + Mulher = Rainha).","<b>3. Transformer + Self-Attention:</b> ao interpretar cada token, considera <b>todo o contexto</b>; processa em paralelo e usa <b>positional encoding</b> pra preservar a ordem das palavras.","<b>4. Probabilidades:</b> gera uma lista de prováveis próximos tokens. <b>Temperature</b> (aleatoriedade), <b>Top-K</b> e <b>Top-P</b> controlam a escolha.","<b>5. Sampling:</b> gera <b>token por token</b>, recalculando o contexto a cada palavra — quanto maior o texto, maior o custo."],
  aplica:["Qualquer geração de texto — ajuste temperature/top-K conforme precise de determinismo ou criatividade.","Conte tokens para estimar <b>custo</b> (operar ChatGPT em escala custa centenas de milhares de dólares/dia).","Dê <b>contexto completo</b> e permita “não sei” para reduzir alucinação → leva direto a Prompt Engineering e RAG."],
  pros:["Entende contexto e relações de longa distância","Extremamente versátil","Processa tokens em paralelo (rápido)"],
  contras:["Não sabe o que é verdade — pode alucinar","Custo cresce com o tamanho do texto","Tem limite de tokens e é não-determinístico"],
  traps:["Assumir que 4.000 tokens = 4.000 palavras","Pressionar o modelo por certeza absoluta","Não dar contexto e culpar o modelo pelo erro","Não permitir resposta “não sei”","Ignorar a temperature numa tarefa que pede determinismo"],
  cola:[["Token","Menor unidade de texto processada (≠ palavra)"],["Embedding","Vetor numérico que representa o significado"],["Transformer","Arquitetura que processa embeddings em paralelo"],["Self-Attention","Considerar todo o contexto ao interpretar cada token"],["Positional encoding","Informação de ordem das palavras"],["Temperature","Controla aleatoriedade/criatividade"],["Top-K / Top-P","Estratégias de escolha do próximo token"],["Alucinação","Afirmação falsa e convincente por falta de contexto"]],
  links:[["Tokenizer da OpenAI","https://platform.openai.com/tokenizer"],["BertViz (visualizar attention)","https://github.com/jessevig/bertviz"],["Guia de prompting (Gemini)","https://ai.google.dev/gemini-api/docs/prompting-strategies"]]
},
{
  id:"06", bloco:3, mod:"Módulo 5 · Cap.3-4", emoji:"🌐", read:"9 min",
  title:"IA no navegador — Web AI e multimodalidade",
  short:"Rodar modelos localmente, offline, entendendo texto, imagem e áudio.",
  oneliner:"<b>Web AI</b> é rodar modelos de IA <b>direto no navegador</b>, na máquina do usuário, sem enviar nada para servidores — e, com a <b>multimodalidade</b>, esses modelos entendem não só texto, mas também <b>imagem e áudio</b>, tudo offline.",
  vovo:[
    "Hoje usar IA é como <b>mandar uma carta pro escritório central</b> (a nuvem) e esperar a resposta voltar. Web AI é ter um <b>funcionário esperto morando dentro da sua casa</b>: resolve tudo ali, sem mandar seus assuntos pra fora — mais <b>privacidade</b> e sem depender da internet.",
    "Tem um preço: esse funcionário é “grande” (o modelo pesa alguns GB) e demora pra “se mudar” (o download). Mas depois trabalha de graça e rápido. E <b>multimodal</b> é quando ele não só <b>lê</b> bilhetes, mas também <b>enxerga</b> fotos e <b>escuta</b> áudios."
  ],
  oque:["<b>Web AI / “Web 4.0”:</b> IA nativa ao navegador, execução <b>local</b> (ex. Gemma, DeepSeek).","<b>Multimodalidade:</b> lidar com e <b>relacionar</b> tipos diferentes de dado — texto, imagem e áudio."],
  como:["Modelos locais são pesados: Gemma ~2.5 GB, DeepSeek ~1.3 GB — baixados ao carregar a página.","O Google embarca o <b>Gemini Nano</b> no Chrome via APIs experimentais (tradução, resumo, prompt).","<b>Rodar LLM no browser:</b> habilitar flags → prompt inicial → configurar temperature e topK → <code>languageModel.create()</code> → resposta em <b>streaming</b>, token por token.","<b>Multimodal:</b> o arquivo vira <b>blob</b> (binário), o modelo interpreta imagem/áudio/texto e responde conforme o prompt."],
  aplica:["Acessibilidade: descrever imagens, transcrever áudio.","Processar documento offline (ex. extrair nome/endereço/telefone de um cartão CNPJ).","Assistentes visuais e auditivos, úteis em mobile. <b>Truque:</b> PT → EN → processa → PT via tradução embutida (recursos multimodais rendem mais em inglês)."],
  pros:["Privacidade: dados não saem da máquina","Sem custo de servidor e funciona offline","Performance aceitável mesmo em apps complexos"],
  contras:["Modelos pesados (vários GB)","Download compromete a UX, sobretudo em mobile","Suporte ainda limitado (foco no Chrome) e recursos experimentais"],
  traps:["Ignorar o custo do download em conexões móveis","Assumir suporte universal de navegador","Usar recursos multimodais só em PT quando funcionam melhor em EN"],
  cola:[["Web AI / Web 4.0","IA rodando nativamente no navegador"],["Gemini Nano","Modelo leve do Google embarcável no Chrome"],["languageModel.create()","API do navegador para invocar a LLM local"],["Streaming","Resposta chegando token por token"],["Multimodalidade","Entender e relacionar texto, imagem e áudio"],["Blob","Formato binário em que o arquivo é processado"]],
  links:[["Chrome Built-in AI (docs)","https://developer.chrome.com/docs/ai/built-in"],["Web AI Demos","https://chrome.dev/web-ai-demos/"],["DeepSeek R1 via WebGPU","https://huggingface.co/spaces/webml-community/deepseek-r1-webgpu"]]
},
{
  id:"07", bloco:4, mod:"Módulo 6", emoji:"✍️", read:"10 min",
  title:"Prompt Engineering — e os padrões JSON e TOON",
  short:"Instruir a IA com clareza pra ela parar de adivinhar.",
  oneliner:"<b>Prompt Engineering</b> é escrever instruções tão claras e estruturadas que a IA para de “adivinhar” o que você quer — reduzindo alucinações e retrabalho. E como LLMs gostam de dados estruturados, os formatos <b>JSON</b> e <b>TOON</b> deixam esses prompts ainda mais precisos e baratos.",
  vovo:[
    "Você contratou um funcionário novo, esforçado, mas que <b>leva tudo ao pé da letra</b> e, na dúvida, <b>inventa</b>. Se você manda “faz um bolo”, ele faz de qualquer sabor e tamanho. O resultado sai errado e você repete tudo.",
    "Prompt Engineering é <b>dar a instrução completa de uma vez</b>: “bolo de fubá, pra 8 pessoas, sem açúcar, e se faltar ingrediente, me avise em vez de improvisar”. E <b>JSON/TOON</b> são como um <b>formulário com campos separados</b> em vez de um bilhete corrido — fica impossível confundir o que é o quê."
  ],
  oque:["A arte de instruir a LLM com <b>clareza e estrutura</b> para reduzir alucinação.","Um framework de <b>10 blocos</b> (inspirado em estudo da Anthropic) guia o modelo.","Dois formatos estruturados: <b>JSON Prompt</b> e <b>TOON</b>."],
  como:["<b>Os 10 blocos:</b> contexto/papel · tom de voz · fonte da verdade · contrato operacional · exemplos · histórico · pedido claro · incentivo ao raciocínio · formato da resposta · restrições e validação.","<b>JSON Prompt:</b> estrutura em campos (meta/context/task/constraints/output), validável com <b>Zod, Ajv, Yup</b> — reduz ambiguidade e torna a saída previsível.","<b>TOON</b> (Token Oriented Object Notation): versão compacta que remove aspas e símbolos pra <b>economizar tokens</b> (367 → 339 num exemplo).","<b>Mas:</b> um JSON bem modelado — sobretudo para dados <b>tabulares</b> — pode ser tão eficiente quanto o TOON, mantendo validação e ferramentas."],
  aplica:["Transformar prompts vagos em instruções precisas (sempre inclua o <b>papel</b> da IA).","Validar saídas de LLM com <b>schemas</b> (Zod) para reprocessar automaticamente.","Comparar consumo de tokens JSON vs TOON no playground antes de escolher."],
  pros:["Menos alucinação e menos retrabalho","Saídas previsíveis e integráveis (validação por schema)","Padroniza prompts para times e pipelines"],
  contras:["Prompt estruturado dá mais trabalho de montar","JSON puro gasta mais tokens pela sintaxe","TOON exige parsing customizado"],
  traps:["Pedido vago sem papel nem contexto (“crie um plano de carreira pra mim”)","Não permitir “não sei” nem orientar a pedir dados faltantes","Não dar exemplos nem definir o formato de saída","Forçar TOON antes de dominar um bom JSON estruturado"],
  cola:[["Papel (role)","Persona atribuída à IA no prompt"],["Fonte da verdade","Dados de referência que ancoram a resposta"],["Contrato operacional","Regras de comportamento (“não sei” é permitido)"],["JSON Prompt","Prompt estruturado em campos (meta/context/task/…)"],["TOON","Notação compacta que economiza tokens"],["Zod / Ajv / Yup","Bibliotecas de validação de schema"]],
  tip:"<b>Recomendação do curso:</b> comece com <b>JSON bem estruturado + validação</b> — resolve a maior parte dos problemas de integração. Deixe o TOON para cenários onde economia de tokens é essencial.",

/* ===================== RENDER ===================== */
const $ = s => document.querySelector(s);
const content = $("#content");
const nav = $("#nav");
const LS_READ = "eia_read_v1", LS_THEME = "eia_theme_v1";

let read = new Set(JSON.parse(localStorage.getItem(LS_READ) || "[]"));
function saveRead(){ localStorage.setItem(LS_READ, JSON.stringify([...read])); }
function corBloco(b){ return getComputedStyle(document.documentElement).getPropertyValue(BLOCOS.find(x=>x.id===b).cor); }

function renderNav(filter=""){
  const f = filter.trim().toLowerCase();
  nav.innerHTML = "";
  BLOCOS.forEach(bl=>{
    const items = TOPICS.filter(t=>t.bloco===bl.id).filter(t=>{
      if(!f) return true;
      return (t.title+" "+t.short+" "+t.cola.map(c=>c[0]+" "+c[1]).join(" ")).toLowerCase().includes(f);
    });
    if(!items.length) return;
    const lab = document.createElement("div");
    lab.className="bloco-label";
    lab.innerHTML = `<span class="dot" style="background:var(${bl.cor})"></span> Bloco ${bl.id} · ${bl.label}`;
    nav.appendChild(lab);
    items.forEach(t=>{
      const el = document.createElement("div");
      el.className = "nav-item"+(read.has(t.id)?" read":"")+(location.hash==="#"+t.id?" active":"");
      el.innerHTML = `<span class="num">${t.id}</span><span class="tt">${t.title}</span><span class="rd"></span>`;
      el.onclick = ()=>{ location.hash=t.id; closeSide(); };
      nav.appendChild(el);
    });
  });
  if(!nav.children.length) nav.innerHTML = `<div class="empty">Nada encontrado.</div>`;
  updateProgress();
}

function updateProgress(){
  const total = TOPICS.length, n = read.size;
  $("#progTxt").textContent = `${n} de ${total} lidos`;
  $("#progBar").style.width = (n/total*100)+"%";
}

function li(arr, cls="clean"){ return `<ul class="${cls}">${arr.map(x=>`<li>${x}</li>`).join("")}</ul>`; }

      <div class="bloco-head"><span class="dot" style="background:var(${bl.cor})"></span>
        <h3>Bloco ${bl.id}</h3><small>${bl.label}</small></div>
      <div class="cards">`;
    items.forEach(t=>{
      html += `<div class="card" style="--cardc:var(${bl.cor})" onclick="location.hash='${t.id}'">
        <div class="emoji">${t.emoji}</div>
        <h4>${t.title}</h4>
        <p>${t.short}</p>
        <div class="meta"><span>#${t.id}</span> · <span>${t.read}</span>${read.has(t.id)?' · <span class="read-badge">✓ lido</span>':''}</div>
      </div>`;
    });
    html += `</div></div>`;
  });

  html += `<div class="materials"><h3>🧰 Materiais oficiais da disciplina</h3><ul>`;
  MATERIAIS.itens.forEach(([label,url])=>{
    html += `<li>${url?`<a href="${url}" target="_blank" rel="noopener">${label}</a>`:label}</li>`;
  });
  html += `</ul></div>`;

  html += `<div class="materials" style="border-left:4px solid var(--warn)"><h3>🪟 Gotcha do Windows (avisado na disciplina)</h3>
    <p style="margin:0;font-size:14px;color:var(--muted)">A instalação do <code>@tensorflow/tfjs-node</code> costuma falhar no Windows.
    Se der erro nos projetos em Node, rode via <b>WSL2</b> ou use a variante <code>@tensorflow/tfjs</code> (CPU/WebGL) em vez da <code>-node</code>.</p></div>`;

  content.innerHTML = html;
  renderNav($("#search").value);
}

function renderTopic(id){
  window.scrollTo(0,0);
  const t = TOPICS.find(x=>x.id===id);
  if(!t){ renderHome(); return; }
  const bl = BLOCOS.find(b=>b.id===t.bloco);
  const idx = TOPICS.indexOf(t);
  const prev = TOPICS[idx-1], next = TOPICS[idx+1];
  const isRead = read.has(t.id);

  let html = `<div style="--cardc:var(${bl.cor})">
    <div class="crumb"><a onclick="goHome()">Central</a> › <span>Disciplina 01</span> › <span>Bloco ${bl.id}</span></div>
    <div class="t-head">
      <div class="t-emoji">${t.emoji}</div>
      <div><h2>${t.title}</h2>
        <div class="badges"><span class="badge mod">${t.mod}</span><span class="badge">⏱ ${t.read}</span><span class="badge">#${t.id}</span></div>
      </div>
    </div>

    <div class="oneliner"><span class="k">Em uma frase</span>${t.oneliner}</div>

    <div class="vovo"><section class="blk" style="margin:0"><h3><span class="ic">👵</span> A analogia da vovó</h3>${t.vovo.map(p=>`<p>${p}</p>`).join("")}</section></div>

    <section class="blk"><h3><span class="ic">💡</span> O que é</h3>${li(t.oque)}</section>

    <section class="blk"><h3><span class="ic">⚙️</span> Como funciona</h3>${li(t.como,"steps")}</section>

    <section class="blk"><h3><span class="ic">🎯</span> Como se aplica</h3>${li(t.aplica)}</section>

    <section class="blk"><h3><span class="ic">⚖️</span> Prós e contras</h3>
      <div class="pc">
        <div class="col pro"><h4>👍 Prós</h4><ul>${t.pros.map(x=>`<li>${x}</li>`).join("")}</ul></div>
        <div class="col con"><h4>👎 Contras</h4><ul>${t.contras.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      </div>
    </section>

    <section class="blk"><div class="traps"><h3><span class="ic">🚫</span> Más práticas e armadilhas</h3><ul>${t.traps.map(x=>`<li>${x}</li>`).join("")}</ul></div></section>
    ${t.tip?`<section class="blk"><div class="tip">${t.tip}</div></section>`:""}

    ${PROJ[t.id]?`<section class="blk"><h3><span class="ic">🛠️</span> No curso — mão na massa</h3><div class="tip" style="border-style:solid;border-color:var(--line)">${PROJ[t.id]}</div></section>`:""}

    <section class="blk"><h3><span class="ic">🧩</span> Cola rápida</h3>
      <dl class="cola">${t.cola.map(([k,v])=>`<div class="row"><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
    </section>

    <details class="links"><summary>Para ir além</summary><ul>${t.links.map(([l,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${l}</a></li>`).join("")}</ul></details>

    <div class="mark-read">
      <button id="readBtn" class="${isRead?'done':''}" onclick="toggleRead('${t.id}')">${isRead?'✓ Lido':'Marcar como lido'}</button>
      <span style="color:var(--muted);font-size:13px">Seu progresso fica salvo neste navegador.</span>
    </div>

    <div class="nextprev">
      ${prev?`<a onclick="location.hash='${prev.id}'"><small>← Anterior</small>${prev.title}</a>`:`<span></span>`}
      ${next?`<a class="next" onclick="location.hash='${next.id}'"><small>Próximo →</small>${next.title}</a>`:`<span></span>`}
    </div>
  </div>`;

  content.innerHTML = html;
  renderNav($("#search").value);
}

function toggleRead(id){
  if(read.has(id)) read.delete(id); else read.add(id);
  saveRead();
  renderTopic(id);
}

function goHome(){ if(location.hash){ location.hash=""; } else { renderHome(); } }
function route(){
  const id = location.hash.replace("#","");
  if(id) renderTopic(id); else renderHome();
}

/* mobile sidebar */
function closeSide(){ $("#side").classList.remove("open"); $("#scrim").classList.remove("show"); }
$("#menuBtn").onclick = ()=>{ $("#side").classList.toggle("open"); $("#scrim").classList.toggle("show"); };
$("#scrim").onclick = closeSide;

/* search */
$("#search").addEventListener("input", e=>renderNav(e.target.value));

/* theme */
function applyTheme(t){
  if(t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
let theme = localStorage.getItem(LS_THEME) || "";
applyTheme(theme);
$("#themeBtn").onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur === "dark" || (!cur && matchMedia("(prefers-color-scheme:dark)").matches);
  theme = isDark ? "light" : "dark";
  localStorage.setItem(LS_THEME, theme);
  applyTheme(theme);
};

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
